name: swipic
description: "Offline swipe photo cleaner for iOS and Android"
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  photo_manager: ^3.7.1
  photo_manager_image_provider: ^2.2.0
  permission_handler: ^12.0.1
  exif: ^3.3.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  video_player: ^2.10.0
  collection: ^1.19.1
  crypto: ^3.0.6
  image: ^4.5.4
  intl: ^0.20.2
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
